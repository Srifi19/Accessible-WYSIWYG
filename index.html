<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessible WYSIWYG Editor</title>

  <!-- GCWeb / WET (these will NOT leak into the editor anymore) -->
  <link rel="stylesheet" href="https://www.canada.ca/etc/designs/canada/wet-boew/css/theme.min.css">
  <script src="https://www.canada.ca/etc/designs/canada/wet-boew/js/theme.min.js"></script>
  <link rel="stylesheet" href="https://wet-boew.github.io/wet-boew/dist/css/wet-boew.min.css">
  <script src="https://wet-boew.github.io/wet-boew/dist/js/wet-boew.min.js"></script>
  <script src="https://wet-boew.github.io/wet-boew/dist/js/deps/jquery.validate.min.js"></script>
</head>

<body>

  <div id="root"></div>

  <script type="module">
    import { WYSIWYGEditor } from './dist/index.js';

    // 1. Get your host element
    const host = document.querySelector('#root');

    // 2. Attach a ShadowRoot
    const shadow = host.attachShadow({ mode: 'open' });

    // 3. Initialize your editor INSIDE the ShadowRoot
    new WYSIWYGEditor({
      container: shadow,
      language: 'fr'
    });
  </script>

</body>
</html>
