<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Accessible WYSIWYG Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="editor-container">
    <h1>Accessible WYSIWYG Editor </h1>

    <!-- Toolbar (SVG icons) -->
<div class="toolbar"
     role="toolbar"
     aria-label="Text formatting toolbar"
     aria-controls="editor">
      <button type="button" class="toolbar-btn" data-command="h2" aria-label="Heading 2" title="Heading 2">
        <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 0 20 20" style="margin-left:-2px;margin-top:-2px" aria-hidden="true" focusable="false">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4 8a2 2 0 0 1-2 2h-2v2h4v2H9v-4a2 2 0 0 1 2-2h2V9H9V7h4a2 2 0 0 1 2 2v2z"></path>
        </svg>
      </button>

      <button type="button" class="toolbar-btn" data-command="h3" aria-label="Heading 3" title="Heading 3">
        <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" style="margin-left:-2px;margin-top:-2px" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M19.01 3h-14c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4 7.5c0 .83-.67 1.5-1.5 1.5.83 0 1.5.67 1.5 1.5V15a2 2 0 0 1-2 2h-4v-2h4v-2h-2v-2h2V9h-4V7h4a2 2 0 0 1 2 2v1.5z"></path>
        </svg>
      </button>

      <button type="button" class="toolbar-btn" id="bold-button" data-command="bold" aria-label="Bold" title="Bold">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
          <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
          <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
        </svg>
      </button>

      <button type="button" class="toolbar-btn" data-command="italic" aria-label="Italic" title="Italic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
          <line x1="19" y1="4" x2="10" y2="4"></line>
          <line x1="14" y1="20" x2="5" y2="20"></line>
          <line x1="15" y1="4" x2="9" y2="20"></line>
        </svg>
      </button>

      <button type="button" class="toolbar-btn" data-command="bullet" aria-label="Unordered list" title="Unordered list">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
          <line x1="9" y1="6" x2="20" y2="6"></line>
          <line x1="9" y1="12" x2="20" y2="12"></line>
          <line x1="9" y1="18" x2="20" y2="18"></line>
          <circle cx="4" cy="6" r="1" fill="currentColor"></circle>
          <circle cx="4" cy="12" r="1" fill="currentColor"></circle>
          <circle cx="4" cy="18" r="1" fill="currentColor"></circle>
        </svg>
      </button>

      <button type="button" class="toolbar-btn" data-command="ordered" aria-label="Ordered list" title="Ordered list">
        <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M3 20v-1h2v-.5H4v-1h1V17H3v-1h3v4Zm5-1v-2h13v2Zm-5-5v-.9L4.8 11H3v-1h3v.9L4.2 13H6v1Zm5-1v-2h13v2ZM4 8V5H3V4h2v4Zm4-1V5h13v2Z"></path>
        </svg>
      </button>

      <button type="button" id="link-button" class="toolbar-btn" data-command="link" aria-label="Link" title="Link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>000000000
      </button>
<button type="button" class="toolbar-btn" id="unlink-button" data-command="unlink" aria-label="Remove link" title="Remove link" tabindex="-1" aria-pressed="false" >
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
    <!-- chain shape -->
    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
    <!-- X overlay -->
    <line x1="5" y1="5" x2="19" y2="19"></line>
  </svg>
</button>


 <!--
        <button type="button" class="toolbar-btn" data-command="indent" aria-label="Indent" title="Indent">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="9" y1="12" x2="21" y2="12"></line>
                        <line x1="9" y1="18" x2="21" y2="18"></line>
                        <polyline points="3 12 6 15 3 18"></polyline>
                    </svg>
                </button>
                
                <button type="button" class="toolbar-btn" data-command="outdent" aria-label="Outdent" title="Outdent">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="9" y1="12" x2="21" y2="12"></line>
                        <line x1="9" y1="18" x2="21" y2="18"></line>
                        <polyline points="6 12 3 15 6 18"></polyline>
                    </svg>
                </button>

                -->
    </div>

    <!-- Editor mount point -->
    <div id="editor" role="textbox" aria-multiline="true" aria-label="Text editor"></div>

    <div id="editor-status" aria-live="polite" class="visually-hidden">

    </div>
    
    <!-- Link Popup Modal -->
    <div class="link-popup" hidden aria-hidden="true" role="dialog" aria-labelledby="link-popup-title" aria-modal="true">
      <div class="link-popup-content">
        <h2 id="link-popup-title">Insert link</h2>

        <label for="link-url-input"><b>URL (required)</b></label>
        <input type="url" id="link-url-input" placeholder="https://google.com" aria-required="true" />

        <label for="link-label-input"><b>Label (optional)</b></label>
        <input type="text" id="link-label-input" placeholder="Link text" />

        <div class="link-popup-buttons">
          <button type="button" class="link-popup-cancel">Cancel</button>
          <button type="button" class="link-popup-apply">Apply</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Initialize editor -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
